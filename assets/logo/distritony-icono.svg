      <line x1="-0.4" y1="27" x2="22.6" y2="4" stroke="rgba(122,62,0,0.22)" stroke-width="1.7"/>
      <line x1="3"    y1="27" x2="26"   y2="4" stroke="rgba(255,242,196,0.17)" stroke-width="0.7"/>
      <line x1="6.4"  y1="27" x2="29.4" y2="4" stroke="rgba(122,62,0,0.22)" stroke-width="1.7"/>
      <line x1="9.8"  y1="27" x2="32.8" y2="4" stroke="rgba(255,242,196,0.15)" stroke-width="0.7"/>
      <line x1="13.2" y1="27" x2="36.2" y2="4" stroke="rgba(122,62,0,0.24)" stroke-width="1.7"/>
