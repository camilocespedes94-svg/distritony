      <stop offset="0%" stop-color="#FFD75A"/><stop offset="42%" stop-color="#F0A202"/><stop offset="100%" stop-color="#B87200"/>
    </linearGradient>
    <linearGradient id="ic-wrap" x1="100%" y1="0%" x2="0%" y2="0%">
